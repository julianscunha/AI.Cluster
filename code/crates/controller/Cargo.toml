[package]
name = "ai-cluster-controller"
version = "0.2.0"
edition = "2024"

[dependencies]
ai-cluster-common = { path = "../common" }
ai-cluster-protocol = { path = "../protocol" }
ai-cluster-catalog = { path = "../catalog" }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.14"
# Porta anônima com teto de conexões; já está na árvore pelo tonic.
tokio-stream = { version = "0.1", features = ["net"] }
# Per-node credentials (S3b) need real entropy; already in the tree through another crate.
getrandom = "0.4"
# Reuses the generated message types for the on-disk snapshot; already in the
# tree through ai-cluster-protocol, so this adds no new crate.
prost = "0.14"
# The Prometheus exporter's HTTP surface (H1). axum is already in the tree as a
# tonic dependency, so this adds no new crate; the features are trimmed to the
# ones the exporter actually uses.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
