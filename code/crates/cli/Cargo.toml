[package]
name = "ai-cluster-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
ai-cluster-common = { path = "../common" }
ai-cluster-protocol = { path = "../protocol" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = "0.14"

[[bin]]
name = "ai-cluster"
path = "src/main.rs"
