[package]
name = "ai-cluster-protocol"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
sha2 = "0.10"
# tls-ring: TLS on the gRPC channel (S4). Features unify across the workspace, so the
# controller and the clients get it from here.
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
