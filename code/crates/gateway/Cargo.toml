[package]
name = "ai-cluster-gateway"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# Codifica o arquivo de estado do gateway (GatewayStats).
prost = "0.14"
ai-cluster-protocol = { path = "../protocol" }
ai-cluster-common = { path = "../common" }
ai-cluster-engine = { path = "../engine" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tonic = "0.14"
# axum is already in the tree through the controller's exporter; "json" brings serde_json so the
# request body is parsed by a real parser instead of by hand.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS da perna HTTP (tls.rs): o handshake é do rustls com o provedor ring que o gRPC já usa.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower-service = "0.3"

[[bin]]
name = "ai-cluster-gateway"
path = "src/main.rs"
