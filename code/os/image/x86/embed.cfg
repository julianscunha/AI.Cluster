set pager=0
set timeout=-1
set aic_feito=0
function aic_procura {
  # laço sobre todos os dispositivos: serve para pendrive MBR ou GPT, em qualquer ordem de discos
  for d in (*); do
    if [ -f $d/aic/grub.cfg -a -f $d/aic/vmlinuz ]; then
      echo "AI Cluster: carregando $d/aic/grub.cfg"
      set root=$d
      set aic_feito=1
      configfile /aic/grub.cfg
      return
    fi
  done
  set aic_r=
  search --no-floppy --file /aic/grub.cfg --set=aic_r
  if [ -n "$aic_r" ]; then
    echo "AI Cluster: carregando ($aic_r)/aic/grub.cfg"
    set root=$aic_r
    set aic_feito=1
    configfile /aic/grub.cfg
  fi
}
for t in 1 2 3; do
  echo "AI Cluster: procurando o pendrive (tentativa $t de 3)..."
  aic_procura
  if [ "$aic_feito" = 1 ]; then break; fi
  sleep 2
done
if [ "$aic_feito" != 1 ]; then
  echo "AI Cluster: nao achei /aic/grub.cfg em nenhum disco. Extraia o usb.zip na RAIZ do pendrive (FAT32)."
  echo "Dispositivos vistos:"
  ls
  sleep --interruptible 8
fi
set timeout=-1
set default=0
menuentry "Tentar de novo (o usb.zip precisa estar extraido na RAIZ do pendrive)" {
  set aic_feito=0
  aic_procura
}
menuentry "Reiniciar o computador" {
  reboot
}
menuentry "Desligar o computador" {
  halt
}
