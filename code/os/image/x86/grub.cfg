# Boot A/B do AI Cluster OS x86_64 UEFI. Embutido no BOOTX64.EFI (grub-mkstandalone): imutável.
# O estado vive em EFI/aic/grubenv na ESP, com a mesma lógica do boot.cmd do armv7:
#   aic_slot  slot confirmado; aic_try  slot em teste (vazio = nenhum); aic_tries  um 'x' por tentativa.
# O slot em teste tem duas tentativas; na terceira o estado volta ao slot confirmado (rollback).
# O aic-slot-commit (no sistema) limpa aic_try quando o worker se registra.
set timeout=0
echo "== AI.Cluster - AI Cluster OS =="
# a ESP é o disco de onde este BOOTX64.EFI foi carregado ($cmdpath), nunca outro disco que tenha o mesmo arquivo
regexp --set=1:esp '^\(([^)]*)\)' "$cmdpath"
set aic_slot=A
set aic_try=
set aic_tries=
load_env -f ($esp)/EFI/aic/grubenv aic_slot aic_try aic_tries
set aic_boot=$aic_slot
if [ -n "$aic_try" ]; then
  if [ "$aic_tries" = xx ]; then
    set aic_try=
    set aic_tries=
  else
    set aic_tries="${aic_tries}x"
    set aic_boot=$aic_try
  fi
fi
save_env -f ($esp)/EFI/aic/grubenv aic_slot aic_try aic_tries

# o disco é o da ESP de onde o GRUB carregou; os slots são as partições 2 (A) e 3 (B) dele
regexp --set=1:d '^([^,]*),' "$esp"
if [ "$aic_boot" = B ]; then
  set p=3
else
  set p=2
fi
probe --part-uuid --set=pu ($d,gpt$p)
linux ($d,gpt$p)/boot/vmlinuz-lts root=PARTUUID=$pu ro rootfstype=ext4 console=tty0 console=ttyS0,115200 panic=10 aic.slot=$aic_boot
initrd ($d,gpt$p)/boot/initramfs-lts
boot
# se o kernel não carregou, não deixa o prompt do GRUB aberto: reinicia (o contador de tentativas leva ao rollback)
echo "AI Cluster OS: falha ao carregar o slot $aic_boot; reiniciando"
sleep 5
reboot
