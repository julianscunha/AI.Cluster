syntax = "proto3";

package ai.cluster.v1;

message NodeIdentity {
  string node_id = 1;
  string device_id = 2;
  string architecture = 3;
  string os_version = 4;
  string runtime_version = 5;
}

message CapabilityReport {
  uint32 cpu_threads = 1;
  uint64 memory_bytes = 2;
  double compute_score = 3;
  double memory_bandwidth_score = 4;
  double storage_score = 5;
  double network_score = 6;
  repeated string precisions = 7;
  repeated string accelerators = 8;
}

message HealthReport {
  double health_score = 1;
  double cpu_utilization = 2;
  double memory_utilization = 3;
  double temperature_c = 4;
  double storage_health = 5;
  double network_latency_ms = 6;
  bool thermal_throttling = 7;
}

message NodeSnapshot {
  NodeIdentity identity = 1;
  CapabilityReport capability = 2;
  HealthReport health = 3;
  string state = 4;
  uint64 registered_at_unix_ms = 5;
  uint64 last_heartbeat_unix_ms = 6;
}

message RegisterNodeRequest {
  NodeIdentity identity = 1;
  CapabilityReport capability = 2;
}

message RegisterNodeResponse {
  bool accepted = 1;
  string cluster_id = 2;
  string message = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  uint64 unix_ms = 2;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message HealthStreamRequest {
  string node_id = 1;
  HealthReport health = 2;
}

message HealthStreamResponse {
  bool accepted = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated NodeSnapshot nodes = 1;
}

message WorkUnit {
  string work_id = 1;
  uint32 rows = 2;
  uint32 shared = 3;
  uint32 cols = 4;
  repeated double matrix_a = 5;
  repeated double matrix_b = 6;
  /// Work ids that must complete before this unit may be dispatched.
  repeated string depends_on = 7;
  /// When set, matrix_a is replaced at dispatch by the output of this work id.
  /// Empty means use the matrix_a payload as-is.
  string matrix_a_from = 8;
  /// Same for matrix_b.
  string matrix_b_from = 9;
  /// Candidate filter: the controller will not hand this unit to a node that
  /// reports fewer cpu_threads than this. 0 means no requirement.
  uint32 min_cpu_threads = 10;
}

message WorkResult {
  string work_id = 1;
  string node_id = 2;
  uint32 rows = 3;
  uint32 cols = 4;
  repeated double matrix_c = 5;
  double checksum = 6;
  uint64 compute_time_us = 7;
}

message RequestWorkRequest {
  string node_id = 1;
}

message RequestWorkResponse {
  bool has_work = 1;
  WorkUnit work = 2;
}

message SubmitWorkResultRequest {
  WorkResult result = 1;
}

message SubmitWorkResultResponse {
  bool accepted = 1;
  string message = 2;
}

message EnqueueWorkRequest {
  uint32 rows = 1;
  uint32 shared = 2;
  uint32 cols = 3;
  uint64 seed = 4;
  uint32 repetitions = 5;
  /// Minimum cpu_threads for every unit enqueued. 0 means no requirement.
  uint32 min_cpu_threads = 6;
}

message EnqueueWorkResponse {
  uint32 enqueued = 1;
}

message EnqueueGraphRequest {
  /// Edge length of each square matrix in the graph.
  uint32 size = 1;
  uint64 seed = 2;
}

message EnqueueGraphResponse {
  uint32 enqueued = 1;
  /// Units held back until their dependencies complete.
  uint32 blocked = 2;
}

message WorkReportRequest {}

message WorkReportEntry {
  string work_id = 1;
  string node_id = 2;
  uint64 compute_time_us = 3;
  uint64 transfer_time_us = 4;
  uint64 total_latency_us = 5;
  double checksum = 6;
}

message WorkReportResponse {
  repeated WorkReportEntry completed = 1;
  uint32 pending = 2;
  /// Units that will never complete: their retry budget ran out, or a unit they
  /// depend on did. Reported so a client can tell "drained" from "gave up".
  uint32 failed = 3;
}

message LeaveNodeRequest {
  string node_id = 1;
}

message LeaveNodeResponse {
  bool accepted = 1;
  uint32 requeued = 2;
}

/// One thing that happened, as the controller saw it. Controller-observed time:
/// node-supplied clocks are never used for ordering.
message Event {
  uint64 at_unix_ms = 1;
  string kind = 2;
  string detail = 3;
}

message ListEventsRequest {
  /// Most recent N events, oldest first. 0 means every event still held.
  uint32 limit = 1;
}

message ListEventsResponse {
  repeated Event events = 1;
}

/// Controller state written to disk so a restart does not lose queued work. Not
/// part of the request surface: this is what the controller saves and reloads,
/// not something a client sends.
message WorkSnapshot {
  /// Units not yet completed: the queue plus whatever was in flight when the
  /// snapshot was taken, so a unit that was running is offered again rather than
  /// dropped.
  repeated WorkUnit pending = 1;
  /// Output of every completed unit. A dependent unit's bound input is read from
  /// here, so without it the units downstream could never become ready.
  repeated WorkOutput outputs = 2;
  /// Dispatch attempts started per unit, keyed by work id.
  map<string, uint32> attempts = 3;
  /// Units that will never complete: their retry budget ran out.
  repeated string failed = 4;
  /// Id sequence, so ids minted after a reload cannot collide with loaded ones.
  uint64 sequence = 5;
}

message WorkOutput {
  string work_id = 1;
  repeated double matrix = 2;
}

service ClusterControl {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportHealth(HealthStreamRequest) returns (HealthStreamResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc LeaveNode(LeaveNodeRequest) returns (LeaveNodeResponse);
  rpc RequestWork(RequestWorkRequest) returns (RequestWorkResponse);
  rpc SubmitWorkResult(SubmitWorkResultRequest) returns (SubmitWorkResultResponse);
  rpc EnqueueWork(EnqueueWorkRequest) returns (EnqueueWorkResponse);
  rpc EnqueueGraph(EnqueueGraphRequest) returns (EnqueueGraphResponse);
  rpc WorkReport(WorkReportRequest) returns (WorkReportResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
}
