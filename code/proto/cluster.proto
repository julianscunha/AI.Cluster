syntax = "proto3";

package ai.cluster.v1;

message NodeIdentity {
  string node_id = 1;
  string device_id = 2;
  string architecture = 3;
  string os_version = 4;
  string runtime_version = 5;
  /// SHA-256 medido do slot em execução (attestation de software: detecta slot corrompido ou
  /// errado; um nó comprometido pode mentir). Vazio enquanto a medição não terminou.
  string image_sha256 = 6;
  /// O nó sabe aplicar uma release (tem comando de atualização). Só esses nós entram no rollout e
  /// só eles podem ser canário.
  bool can_update = 7;
}

message CapabilityReport {
  uint32 cpu_threads = 1;
  uint64 memory_bytes = 2;
  double compute_score = 3;
  double memory_bandwidth_score = 4;
  // Taxa de escrita sequencial com fsync do disco onde o worker roda, relativa à referência
  // de 500 MB/s (um SATA SSD): 1.0 é isso, 0.2 um HDD, 6.0 um NVMe (Fase K2). Zero é "não
  // medido" (sonda falhou), nunca "disco lento". Maior é melhor.
  double storage_score = 5;
  // Velocidade do link relativa à referência (1 GbE): 1.0 é uma rede de 1 GbE, 10.0 uma de
  // 10 GbE. É a velocidade *nominal* do link, não a taxa alcançada (Fase C1); medir a taxa
  // sob carga é uma fatia de benchmark. Zero é "não medido", nunca "sem rede" — e o modelo de
  // placement trata "não medido" como a rede de referência. Maior é melhor.
  double network_score = 6;
  repeated string precisions = 7;
  repeated string accelerators = 8;
  /// Classes de armazenamento em bloco detectadas no nó, da mais quente para a mais fria:
  /// "nvme", "ssd", "hdd". Vazio significa "não medido", não "sem armazenamento" — um nó
  /// que não expõe `/sys/block` reporta vazio. O tier HOT (RAM/VRAM) não aparece aqui:
  /// `memory_bytes` é a medida dele. Ver docs/system/02-subsistemas/dados/storage-intelligence.md.
  repeated string storage_classes = 9;
  /// Compute remedido depois do registro, na mesma escala de `compute_score`.
  ///
  /// `compute_score` é a medida do registro — o baseline. Esta é a última medida tirada
  /// com o nó ocioso, para pegar o que o baseline não vê: um nó que ficou mais lento
  /// depois de entrar (vizinho barulhento no host, limite de energia) sem sensor de
  /// temperatura que denuncie. Zero significa "não remedido desde o registro", nunca
  /// "compute zero": um nó sem essa medida vale o baseline.
  double current_compute_score = 10;
  /// Quanto confiar em `current_compute_score`, 0..1, a partir de quanto as repetições
  /// da medida concordaram entre si. Uma passada sob contenção varia muito; uma ociosa
  /// varia pouco. Zero junto com `current_compute_score` zero.
  double compute_confidence = 11;
  /// Score do benchmark de registro pela **mediana** das execuções, na mesma escala de
  /// `compute_score`. `compute_score` é o melhor caso (a execução menos perturbada) e
  /// serve para ordenar nós; a mediana é o valor central e serve para **calibrar** —
  /// prever tempo com o melhor caso subestima sempre, porque a máquina raramente repete
  /// a execução mais sortuda. Zero significa "não medido", nunca "compute zero".
  double compute_median_score = 12;
  /// Desvio relativo das execuções do benchmark de registro: `desvio-padrão / média`
  /// dos tempos (coeficiente de variação). Zero é uma medida perfeitamente estável —
  /// mas note que um nó com o score fixado (`AI_CLUSTER_COMPUTE_SCORE`) não mede nada, e
  /// então reporta zero aqui junto com `compute_median_score` zero: zero é "não medido"
  /// nesse caso, não "estável". É o desvio que diz se a mediana acima é um número em que
  /// se pode confiar para calibrar.
  double compute_deviation = 13;
  /// Taxa de upload alcançada até o controller, na mesma escala de `network_score` (1.0 =
  /// 1 GbE), medida por `ProbeLink` no registro (Fase C2). O placement lê o menor entre ela e
  /// o `network_score` nominal: o link é o teto, a medida é o que ele entregou. Zero é "não
  /// medido" — nó com `AI_CLUSTER_NETWORK_SCORE` fixado, ou sonda que falhou — nunca "sem rede".
  double network_achieved_score = 14;
  /// Última remedida da taxa alcançada, tirada com o nó ocioso (Fase C4), na mesma escala de
  /// `network_achieved_score`. Se cair abaixo do baseline do registro, o link degradou, e o
  /// placement passa a ler esta no lugar do baseline. Zero é "não remedido", nunca "link zero".
  double current_network_score = 15;
  /// Unidades que o worker roda ao mesmo tempo (fila local por recurso, G4). Os núcleos
  /// concedidos se dividem entre elas. Zero é "não reportado" e vale 1, o comportamento de antes.
  uint32 work_slots = 16;
  /// Latência de uma escrita de 4 KiB com fsync no disco onde o worker roda, em milissegundos
  /// (menor de várias, como as outras sondas). É o que separa HDD de SSD de NVMe quando a vazão
  /// sequencial engana. Zero é "não medido", nunca "disco instantâneo". Menor é melhor.
  double storage_latency_ms = 17;
  /// Bytes que o worker aceita manter residentes como fatias de modelo (`AI_CLUSTER_SHARD_CACHE_MB`).
  /// Zero é "não participa do canal de fatias" (sem `AI_CLUSTER_MODEL_DIR`) ou worker antigo.
  uint64 shard_cache_bytes = 18;
  /// Quão limpo foi o benchmark do registro (o baseline), 0..1: a melhor execução sobre a mediana.
  /// Perto de 1, as execuções concordaram e o baseline é o que o nó faz de verdade; baixo, o nó
  /// estava perturbado (vizinho barulhento, frequência oscilando) e a mediana é a mais confiável.
  /// Zero é "não medido" (score fixado ou benchmark que falhou), nunca "baseline ruim".
  double baseline_confidence = 19;
  /// Fração dos segmentos TCP enviados que foram retransmitidos durante a sonda do registro, 0..1
  /// (`RetransSegs` sobre `OutSegs` do kernel). É a perda de pacotes que o TCP esconde: o link
  /// entrega, mas gasta banda reenviando. Zero é "sem perda medida" ou "não medido" (sem
  /// /proc/net/snmp, ou score de rede fixado); o contador é do host, então vale na sonda ociosa.
  double network_retransmit_ratio = 20;
  /// Desvio relativo da taxa entre as repetições da sonda de rede (desvio-padrão sobre média).
  /// Link congestionado ou compartilhado oscila entre repetições; link livre repete. Zero é
  /// estável ou não medido.
  double network_jitter = 21;
  /// Taxa de leitura sequencial do disco do worker sem passar pelo cache de páginas (O_DIRECT),
  /// relativa à mesma referência de 500 MB/s de `storage_score`. Zero é "não medido": o sistema
  /// de arquivos não aceita O_DIRECT (tmpfs) ou a sonda falhou, nunca "disco lento".
  double storage_read_score = 22;
  /// Dispositivo de bloco (disco inteiro, sem a partição) em que as sondas de storage mediram,
  /// por exemplo "mmcblk0" ou "nvme0n1". Vazio é "não identificado" (contêiner, overlay): os
  /// números de storage valem para onde o worker roda, não necessariamente para um disco.
  string storage_device = 23;
  /// Banda de memória com todos os núcleos copiando ao mesmo tempo (até 4 threads), somada e
  /// relativa à mesma referência de `memory_bandwidth_score`, que é de uma thread só. A razão entre
  /// as duas diz se a memória escala com os núcleos ou satura (SBC com barramento único satura).
  /// Zero é "não medido".
  double memory_bandwidth_loaded_score = 24;
  /// Cada disco que o worker consegue medir (até quatro), não só o do diretório da sonda. Vazio é
  /// "não medido": contêiner, ou nenhum ponto de montagem de disco aceita um arquivo novo.
  repeated StorageDevice storage_devices = 25;
}

message StorageDevice {
  /// Disco inteiro, sem a partição ("mmcblk0", "nvme0n1").
  string name = 1;
  /// Escrita sequencial com fsync sobre 500 MB/s, como `storage_score`. Zero é "não medido".
  double write_score = 2;
  /// Leitura sequencial com O_DIRECT sobre 500 MB/s, como `storage_read_score`. Zero é "não medido".
  double read_score = 3;
}

// Sonda de throughput: o worker sobe `payload` e cronometra o RPC.
message ProbeLinkRequest {
  bytes payload = 1;
}

message ProbeLinkResponse {
  uint64 received_bytes = 1;
}

message HealthReport {
  double health_score = 1;
  double cpu_utilization = 2;
  double memory_utilization = 3;
  double temperature_c = 4;
  double storage_health = 5;
  double network_latency_ms = 6;
  bool thermal_throttling = 7;
  /// Fraction of swap in use, 0..1. Zero when the node has no swap configured, which is
  /// also what an idle node with swap reports — the two are not distinguished.
  double swap_utilization = 8;
  /// Disk operations completed per second since the previous report. Zero on the first
  /// report, which has no previous sample to difference against. Sums every entry the
  /// kernel lists, so partitions of the same disk are counted twice.
  double disk_io_ops = 9;
  /// Carga da bateria, 0..1, quando o nó tem uma (F18 Q6). Zero com `on_battery` falso é "sem
  /// bateria visível", nunca "bateria vazia".
  double battery_level = 10;
  /// O nó está rodando na bateria (descarregando), não na tomada.
  bool on_battery = 11;
}

message NodeSnapshot {
  NodeIdentity identity = 1;
  CapabilityReport capability = 2;
  HealthReport health = 3;
  string state = 4;
  uint64 registered_at_unix_ms = 5;
  uint64 last_heartbeat_unix_ms = 6;
  // Confiança (Fase S2): um nó novo nasce não confiável e só recebe trabalho depois de aprovado.
  bool trusted = 7;
  // Verdadeiro quando o nó roda a release desejada e a medida do slot (`image_sha256`) confere com a
  // assinada. Calculado na leitura; não é persistido. Software apenas: um nó comprometido mente.
  bool attested = 8;
}

message ApproveNodeRequest {
  string node_id = 1;
}

message RevokeNodeRequest {
  string node_id = 1;
}

message RevokeNodeResponse {
  // Falso quando o nó é desconhecido.
  bool revoked = 1;
  // Unidades em voo que voltaram para a fila.
  uint32 requeued = 2;
}

message ApproveNodeResponse {
  // Falso quando o nó é desconhecido; aprovar de novo um nó já aprovado continua verdadeiro.
  bool approved = 1;
}

message RegisterNodeRequest {
  NodeIdentity identity = 1;
  CapabilityReport capability = 2;
  /// Cópia do estado do controller que este nó guardou (I4). O nó oferece o que tem a cada
  /// (re-)registro; um controller que perdeu os próprios arquivos adota a mais nova. Vazio
  /// quando o nó não guarda cópia (`AI_CLUSTER_STATE_REPLICA` não definido).
  StateReplica replica = 3;
}

message RegisterNodeResponse {
  bool accepted = 1;
  string cluster_id = 2;
  string message = 3;
  // Segredo do nó (Fase S3b), emitido a cada registro de quem não prova o anterior. O nó o
  // devolve no cabeçalho x-ai-cluster-node-auth em toda chamada que fala por ele.
  string node_credential = 4;
}

message HeartbeatRequest {
  string node_id = 1;
  uint64 unix_ms = 2;
  /// Época da cópia de estado que este nó guarda (I4). Zero quando não guarda nenhuma. O
  /// controller só manda uma cópia nova quando a dele é mais recente que esta — o nó
  /// confirma o que recebeu reportando a época na batida seguinte, então a resposta não
  /// precisa de estado por nó do lado do controller.
  uint64 replica_epoch_unix_ms = 3;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  /// Cópia do estado do controller para o nó guardar (I4). Presente só quando a época do
  /// controller avançou além da que o nó reportou; ausente na maioria das batidas.
  StateReplica replica = 2;
  /// Release que este nó deve passar a rodar (F19). Presente só quando difere da versão que o
  /// nó registrou e o rollout o liberou; ausente na maioria das batidas.
  Release release = 3;
}

/// Uma versão do sistema e onde buscá-la (F19). O SHA-256 é do artefato e a assinatura Ed25519
/// do operador cobre placa, versão e as duas somas; quem confere é o nó (aic-updater), não o controller.
message Release {
  string version = 1;
  string url = 2;
  string sha256 = 3;
  /// SHA-256 do conteúdo do slot depois de gravado (a imagem ext4 descomprimida): o nó confere o
  /// que gravou e, se medir o slot ativo, reporta o mesmo valor em `NodeIdentity.image_sha256`.
  string image_sha256 = 4;
  /// Assinatura Ed25519 (base64) do operador sobre placa, versão, sha256 e image_sha256. Quem
  /// verifica é o nó (chave pública na imagem), não o controller.
  string signature = 5;
}

message SetReleaseRequest {
  /// Vazia (version em branco) cancela o rollout.
  Release release = 1;
}

message SetReleaseResponse {}

/// Uma cópia do estado do controller guardada fora do volume dele (I4).
///
/// O controller já escreve dois arquivos locais, e eles morrem junto com o volume. A cópia
/// num nó sobrevive a isso: um controller novo, sem nenhum arquivo, restaura daqui. A
/// época data a cópia — o nó guarda a mais nova que viu, e o controller só oferece a sua
/// quando ela é mais recente que a que o nó já tem.
message StateReplica {
  uint64 epoch_unix_ms = 1;
  /// O `WorkSnapshot` codificado, exatamente os bytes que foram para os arquivos locais.
  bytes snapshot = 2;
}

message HealthStreamRequest {
  string node_id = 1;
  HealthReport health = 2;
  /// Perfil de capacidade corrente. Opcional: um worker que não remede manda só o
  /// health, e o controlador mantém o perfil do registro. Quando vem, substitui o
  /// perfil guardado — `compute_score` continua sendo o baseline, e
  /// `current_compute_score` carrega a medida mais recente (C3).
  CapabilityReport capability = 3;
}

message HealthStreamResponse {
  bool accepted = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated NodeSnapshot nodes = 1;
}

message WorkUnit {
  string work_id = 1;
  uint32 rows = 2;
  uint32 shared = 3;
  uint32 cols = 4;
  repeated double matrix_a = 5;
  repeated double matrix_b = 6;
  /// Ids de trabalho que devem completar antes que esta unidade possa ser despachada.
  repeated string depends_on = 7;
  /// Quando definido, matrix_a é substituído no despacho pela saída deste id de trabalho.
  /// Vazio significa usar o payload de matrix_a como está.
  string matrix_a_from = 8;
  /// O mesmo para matrix_b.
  string matrix_b_from = 9;
  /// Filtro de candidatos: o controller não entregará esta unidade a um nó que
  /// reporte menos cpu_threads que isto. 0 significa sem requisito.
  uint32 min_cpu_threads = 10;
  /// Requisição de cliente que gerou esta unidade (H3). Todas as unidades enfileiradas
  /// numa mesma chamada carregam o mesmo id, então um trace reconstrói o caminho
  /// requisição → unidades sem guardar a relação em paralelo.
  string request_id = 11;
  /// Classe de prioridade (G4): maior é despachada antes. 0 é a classe padrão; a fila continua
  /// FIFO dentro da classe, e o envelhecimento impede que uma classe alta mate a baixa de fome.
  uint32 priority = 12;
  /// Só um nó atestado pode receber esta unidade: roda a release desejada e a medida do slot
  /// (`image_sha256`) confere com a assinada. Sem release publicada ninguém é atestado, e a unidade
  /// espera. É atestação de software: um nó comprometido mente (veja `NodeSnapshot.attested`).
  bool require_attested = 13;
}

message WorkResult {
  string work_id = 1;
  string node_id = 2;
  uint32 rows = 3;
  uint32 cols = 4;
  repeated double matrix_c = 5;
  double checksum = 6;
  uint64 compute_time_us = 7;
}

message RequestWorkRequest {
  string node_id = 1;
}

message RequestWorkResponse {
  bool has_work = 1;
  WorkUnit work = 2;
}

message SubmitWorkResultRequest {
  WorkResult result = 1;
}

message SubmitWorkResultResponse {
  bool accepted = 1;
  string message = 2;
}

message EnqueueWorkRequest {
  uint32 rows = 1;
  uint32 shared = 2;
  uint32 cols = 3;
  uint64 seed = 4;
  uint32 repetitions = 5;
  /// Mínimo de cpu_threads para cada unidade enfileirada. 0 significa sem requisito.
  uint32 min_cpu_threads = 6;
  /// Id de requisição que agrupa as unidades desta chamada (H3). Vazio faz o controller
  /// gerar um, que volta na resposta.
  string request_id = 7;
  /// Classe de prioridade das unidades desta chamada (G4). 0 é a padrão; maior vai antes.
  uint32 priority = 8;
  /// Só nós atestados recebem as unidades desta chamada (`WorkUnit.require_attested`).
  bool require_attested = 9;
}

message EnqueueWorkResponse {
  uint32 enqueued = 1;
  /// O id que agrupa as unidades desta chamada; use em `GetTrace`.
  string request_id = 2;
}

message EnqueueGraphRequest {
  /// Comprimento da aresta de cada matriz quadrada no grafo.
  uint32 size = 1;
  uint64 seed = 2;
  /// Id de requisição que agrupa as unidades do grafo (H3). Vazio faz o controller gerar.
  string request_id = 3;
  /// Guarda a saída da unidade final do grafo para `GetOutput` (Fase J1). Sem isto a saída é
  /// descartada assim que nada mais a lê.
  bool keep_result = 4;
  /// Classe de prioridade das unidades do grafo (G4). 0 é a padrão; maior vai antes.
  uint32 priority = 5;
}

/// Uma fatia de pesos: as linhas [row_start, row_end) do tensor `[out, in]` de
/// `<raiz de modelos do nó>/<model_subdir>/model.safetensors`, calculada por `node_id`.
message ShardOp {
  string node_id = 1;
  string model_subdir = 2;
  string tensor = 3;
  uint32 row_start = 4;
  uint32 row_end = 5;
  /// As faixas são colunas de um tensor `[in, out]` (GPT-2), não linhas de um `[out, in]`.
  bool by_columns = 6;
}

message ShardCapacityRequest {
  repeated string node_ids = 1;
}

message NodeShardCapacity {
  string node_id = 1;
  /// Nó registrado, aprovado e vivo.
  bool available = 2;
  uint64 shard_cache_bytes = 3;
  uint64 memory_bytes = 4;
}

message GatewayModel {
  string model_id = 1;
  /// Nós que guardam as fatias do modelo; vazio quando ele roda inteiro no gateway.
  repeated string shard_nodes = 2;
}

message ReportGatewayRequest {
  string gateway_id = 1;
  /// Endereço HTTP por onde os clientes chegam ao gateway (`AI_CLUSTER_GATEWAY_URL`).
  string url = 2;
  repeated GatewayModel models = 3;
}

message ReportGatewayResponse {}

message ListGatewaysRequest {}

message GatewayInfo {
  string gateway_id = 1;
  string url = 2;
  repeated GatewayModel models = 3;
  uint64 last_seen_unix_ms = 4;
  /// Verdadeiro se a última apresentação é recente. Calculado na leitura; não é persistido.
  bool alive = 5;
}

message ListGatewaysResponse {
  repeated GatewayInfo gateways = 1;
}

message ShardCapacityResponse {
  repeated NodeShardCapacity nodes = 1;
}

message ShardMatmulRequest {
  uint32 rows = 1;
  uint32 k = 2;
  /// `rows x k`, linha a linha; a mesma entrada vale para todas as operações.
  repeated double x = 3;
  repeated ShardOp ops = 4;
}

message ShardOutput {
  uint32 rows = 1;
  uint32 cols = 2;
  repeated double data = 3;
  /// Tempo de cálculo medido no worker, sem rede.
  uint64 compute_us = 4;
}

message ShardMatmulResponse {
  repeated ShardOutput outputs = 1;
}

/// Controller -> worker pelo canal residente.
message ShardCompute {
  uint64 op_id = 1;
  string model_subdir = 2;
  string tensor = 3;
  uint32 row_start = 4;
  uint32 row_end = 5;
  uint32 rows = 6;
  uint32 k = 7;
  repeated double x = 8;
  bool by_columns = 9;
}

/// Worker -> controller pelo canal residente.
message ShardResult {
  uint64 op_id = 1;
  bool ok = 2;
  string error = 3;
  uint32 rows = 4;
  uint32 cols = 5;
  repeated double data = 6;
  uint64 compute_us = 7;
  // The request itself was refused (not the node): the caller should not retry elsewhere.
  bool invalid = 8;
}

/// Cancela uma requisição (F11): as unidades dela que ainda estão na fila saem dela, e as que
/// dependiam delas saem juntas. Unidades já despachadas a um worker terminam normalmente.
message CancelRequestRequest {
  string request_id = 1;
}

message CancelRequestResponse {
  /// Unidades retiradas da fila.
  uint32 removed = 1;
  /// Unidades que já estavam num worker e seguem até o fim.
  uint32 in_flight = 2;
}

message GetOutputRequest {
  string request_id = 1;
}

/// A saída guardada de uma requisição enfileirada com `keep_result`. `found` falso quando a
/// requisição é desconhecida, ainda não terminou, ou foi expulsa (o controller guarda só as
/// últimas 64).
message GetOutputResponse {
  bool found = 1;
  uint32 rows = 2;
  uint32 cols = 3;
  repeated double matrix_c = 4;
}

message EnqueueGraphResponse {
  uint32 enqueued = 1;
  /// Unidades retidas até que suas dependências completem.
  uint32 blocked = 2;
  /// O id que agrupa as unidades deste grafo; use em `GetTrace`.
  string request_id = 3;
}

/// Uma unidade dentro do trace de uma requisição (H3): onde ela está no seu ciclo de
/// vida e quanto custou. Só uma unidade concluída tem tempos; as demais vêm com zero.
message TraceEntry {
  string work_id = 1;
  /// Vazio enquanto a unidade não foi despachada, ou se falhou sem despacho registrado.
  string node_id = 2;
  /// queued | dispatched | completed | failed.
  string status = 3;
  uint64 compute_time_us = 4;
  uint64 transfer_time_us = 5;
  uint64 total_latency_us = 6;
  /// Tempo de compute que o modelo de custo previu para esta unidade no nó que a
  /// recebeu (H5). Zero quando o nó não reportou compute score, ou quando a unidade
  /// ainda não foi despachada — zero significa "não previsto", não "instantâneo".
  uint64 predicted_compute_us = 7;
}

message GetTraceRequest {
  string request_id = 1;
}

/// Caminho requisição → unidades. Vazio (sem erro) quando o id é desconhecido: um trace
/// perdido por restart não é um erro do cliente. As unidades vêm agrupadas por estado —
/// enfileiradas, em voo, concluídas, falhas — e dentro de um estado na ordem em que o
/// controller as moveu, que para um grafo é a ordem de execução.
message GetTraceResponse {
  string request_id = 1;
  repeated TraceEntry units = 2;
}

/// Uma reserva de nó para execução futura (G6). O nó fica retido para um `request_id`
/// antes de o trabalho existir: enquanto a reserva durar, unidades de outras requisições
/// não são colocadas nesse nó, e a requisição dona da reserva tem o nó só para si.
message Reservation {
  string node_id = 1;
  string request_id = 2;
  /// Unix ms em que a reserva expira sozinha, para um cliente que reservou e sumiu não
  /// segurar o nó para sempre.
  uint64 expires_at_unix_ms = 3;
  /// Slots do nó que a reserva guarda para a requisição dona; 0 é o nó inteiro.
  uint32 slots = 4;
}

message ReserveRequest {
  string node_id = 1;
  /// Requisição para quem o nó é retido.
  string request_id = 2;
  /// Quanto tempo a reserva vale, a partir de agora. 0 usa o padrão do controller.
  uint64 ttl_ms = 3;
  /// Quantos slots de trabalho (`work_slots`) do nó ficam guardados para a requisição. As outras
  /// requisições só usam o nó enquanto sobrar slot além dos guardados. 0 retém o nó inteiro, como
  /// antes; o campo novo mantém o wire compatível nos dois sentidos.
  uint32 slots = 4;
}

message ReserveResponse {
  bool granted = 1;
  uint64 expires_at_unix_ms = 2;
  string message = 3;
}

message ListReservationsRequest {}

message ListReservationsResponse {
  repeated Reservation reservations = 1;
}

/// Liberar é por nó: um nó tem no máximo uma reserva, então o nó identifica qual soltar.
message ReleaseReservationRequest {
  string node_id = 1;
}

message ReleaseReservationResponse {
  bool released = 1;
}

message WorkReportRequest {}

message WorkReportEntry {
  string work_id = 1;
  string node_id = 2;
  uint64 compute_time_us = 3;
  uint64 transfer_time_us = 4;
  uint64 total_latency_us = 5;
  double checksum = 6;
}

message WorkReportResponse {
  repeated WorkReportEntry completed = 1;
  uint32 pending = 2;
  /// Unidades que nunca completarão: seu orçamento de retry acabou, ou o de uma
  /// unidade da qual dependem. Reportado para um cliente distinguir "drenado" de "desistiu".
  uint32 failed = 3;
}

message LeaveNodeRequest {
  string node_id = 1;
}

message LeaveNodeResponse {
  bool accepted = 1;
  uint32 requeued = 2;
}

/// Algo que aconteceu, como o controller viu. Tempo observado pelo controller:
/// relógios fornecidos pelos nós nunca são usados para ordenação.
message Event {
  uint64 at_unix_ms = 1;
  string kind = 2;
  string detail = 3;
}

message ListEventsRequest {
  /// N eventos mais recentes, mais antigos primeiro. 0 significa todo evento ainda retido.
  uint32 limit = 1;
}

message WatchEventsRequest {}

message ListEventsResponse {
  repeated Event events = 1;
}

/// Aggregate cluster metrics at the moment the controller answered (H1).
///
/// A point-in-time snapshot, not a time series: each read is computed from the current
/// registry and work state, so two reads a second apart can differ. Node detail stays in
/// `ListNodes`; this is the cluster-wide roll-up a dashboard or a `status` reads.
message MetricsResponse {
  uint32 nodes_total = 1;
  /// Nodes the controller would hand new work to: registered and not draining, offline
  /// or quarantined. This is the candidate set placement ranks over.
  uint32 nodes_available = 2;
  uint32 units_completed = 3;
  uint32 units_pending = 4;
  uint32 units_blocked = 5;
  uint32 units_failed = 6;
  /// Sum over completed units of the time the worker spent computing, as reported by the
  /// worker. Excludes transfer and queueing, so it is a floor on the work actually done.
  uint64 total_compute_time_us = 7;
  /// Sum over completed units of dispatch-to-result latency as the controller observed it,
  /// including transfer and any queue wait. The gap to `total_compute_time_us` is overhead.
  uint64 total_latency_us = 8;
  /// `total_compute_time_us / units_completed`, rounded down. Zero when nothing completed.
  uint64 avg_compute_time_us = 9;
  /// `total_latency_us / units_completed`, rounded down. Zero when nothing completed.
  uint64 avg_latency_us = 10;
  /// Percentis sobre as unidades concluídas que o controller ainda retém. `p50` é a
  /// mediana; `p95` mostra a cauda, que a média esconde. Zero quando nada concluiu.
  /// O índice é `ceil(p * n) - 1` sobre a lista ordenada, então com uma unidade só os
  /// quatro percentis são o mesmo número.
  uint64 p50_compute_time_us = 11;
  uint64 p95_compute_time_us = 12;
  uint64 p50_latency_us = 13;
  uint64 p95_latency_us = 14;
  /// Soma, sobre as unidades concluídas, do compute que o modelo de custo previu (H5).
  /// Lida ao lado de `total_compute_time_us`, é o erro do modelo no cluster inteiro:
  /// a distância entre o que o placement esperava custar e o que a máquina gastou.
  /// Zero quando nenhuma unidade concluída teve previsão — "não previsto", não "instantâneo".
  uint64 total_predicted_compute_us = 15;
}

message GetMetricsRequest {}

/// Estado do controller gravado em disco para que um restart não perca trabalho em fila.
/// Não faz parte da superfície de requests: isto é o que o controller salva e recarrega,
/// não algo que um cliente envia.
message WorkSnapshot {
  /// Unidades ainda não despachadas: só a fila. O que está em voo vai em `dispatched`,
  /// com o dono, para que um restart do controller saiba de quem era cada unidade.
  repeated WorkUnit pending = 1;
  /// Saída de cada unidade concluída. A entrada vinculada de uma unidade dependente é lida
  /// daqui, então sem isto as unidades a jusante nunca ficariam prontas.
  repeated WorkOutput outputs = 2;
  /// Tentativas de despacho iniciadas por unidade, indexadas por id de trabalho.
  map<string, uint32> attempts = 3;
  /// Unidades que nunca completarão: seu orçamento de retry acabou.
  repeated string failed = 4;
  /// Sequência de ids, para que ids gerados após um reload não colidam com os carregados.
  uint64 sequence = 5;
  /// Unidades em voo, com o nó que as segura. É o registro de posse: um reload sabe quem
  /// era o dono, em vez de oferecer a unidade de novo e aceitar só o resultado do novo dono.
  repeated WorkLease dispatched = 6;
  /// Época desta gravação (I4). Guardada dentro do arquivo porque é o arquivo que data o
  /// estado: um controller que o recarrega sabe com que idade a sua cópia sai, e um nó
  /// compara a cópia dele contra isso. Sem o campo aqui todo restart pareceria época zero.
  uint64 epoch_unix_ms = 7;
  /// Reservas de nó ainda válidas. Vão no mesmo snapshot (e na réplica I4) para sobreviverem a um
  /// reinício e serem herdadas por um controller que assuma pela cópia de um nó.
  repeated ReservationEntry reservations = 8;
}

message ReservationEntry {
  string node_id = 1;
  string request_id = 2;
  uint64 expires_at_unix_ms = 3;
  uint32 slots = 4;
}

/// Posse de uma unidade despachada: quem a segura e desde quando. `unit` viaja junto porque
/// o dono pode não voltar — sem o payload, a unidade não teria como ser reoferecida.
message WorkLease {
  string work_id = 1;
  string node_id = 2;
  uint64 dispatched_at_unix_ms = 3;
  uint64 predicted_compute_us = 4;
  WorkUnit unit = 5;
}

message WorkOutput {
  string work_id = 1;
  repeated double matrix = 2;
}

// Serviço próprio para que o servidor imponha um teto de mensagem de 4 MiB só aqui, sem
// tocar o limite de 64 MiB do tráfego de dados do ClusterControl.
service LinkProbe {
  rpc ProbeLink(ProbeLinkRequest) returns (ProbeLinkResponse);
}

service ClusterControl {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc ApproveNode(ApproveNodeRequest) returns (ApproveNodeResponse);
  rpc RevokeNode(RevokeNodeRequest) returns (RevokeNodeResponse);
  rpc SetRelease(SetReleaseRequest) returns (SetReleaseResponse);
  rpc GetOutput(GetOutputRequest) returns (GetOutputResponse);
  /// Canal residente de um worker (J5): o worker abre o stream e recebe operações de fatia de
  /// peso; o nó vem no metadata `x-ai-cluster-node-id`, com a credencial do nó.
  rpc ShardChannel(stream ShardResult) returns (stream ShardCompute);
  /// Só operador: roda `x * fatia^T` em cada nó indicado e devolve as saídas na mesma ordem.
  rpc ShardMatmul(ShardMatmulRequest) returns (ShardMatmulResponse);
  /// Token de inferência ou de operador: quanto cada nó nomeado aceita guardar de fatias, para o
  /// gateway recusar na subida um modelo que os nós não comportam.
  rpc ShardCapacity(ShardCapacityRequest) returns (ShardCapacityResponse);
  /// Token de inferência ou de operador: o gateway se apresenta (quem é, onde está, que modelos serve
  /// e em quais nós ficam as fatias) e repete a cada poucos segundos. É o que `ListGateways` e a
  /// topologia mostram; o gateway não é um nó e não recebe trabalho.
  rpc ReportGateway(ReportGatewayRequest) returns (ReportGatewayResponse);
  /// Só operador: os gateways que se apresentaram, com a marca de vivo.
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportHealth(HealthStreamRequest) returns (HealthStreamResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc LeaveNode(LeaveNodeRequest) returns (LeaveNodeResponse);
  rpc RequestWork(RequestWorkRequest) returns (RequestWorkResponse);
  rpc SubmitWorkResult(SubmitWorkResultRequest) returns (SubmitWorkResultResponse);
  rpc EnqueueWork(EnqueueWorkRequest) returns (EnqueueWorkResponse);
  rpc EnqueueGraph(EnqueueGraphRequest) returns (EnqueueGraphResponse);
  rpc WorkReport(WorkReportRequest) returns (WorkReportResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  /// Só operador: os eventos novos, um a um, à medida que acontecem (barramento). Não repete o
  /// que já aconteceu; para o histórico use ListEvents. Um assinante lento perde eventos e
  /// recebe um evento `events_lagged` com a contagem.
  rpc WatchEvents(WatchEventsRequest) returns (stream Event);
  rpc GetMetrics(GetMetricsRequest) returns (MetricsResponse);
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
  rpc CancelRequest(CancelRequestRequest) returns (CancelRequestResponse);
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
}
