<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <rect width="1100" height="300" rx="14" fill="#0f172a"/>
  <text x="30" y="40" fill="#e2e8f0" font-size="20" font-weight="600">Uma camada, várias máquinas</text>
  <text x="30" y="64" fill="#94a3b8" font-size="14">Cada projeção de peso é fatiada por linhas; cada worker guarda a sua fatia na memória e devolve só o resultado parcial.</text>
  <rect x="30" y="100" width="260" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="130" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Matriz de pesos W</text>
  <rect x="55" y="145" width="210" height="28" fill="#38bdf8" opacity=".85"/><rect x="55" y="173" width="210" height="28" fill="#a78bfa" opacity=".85"/><rect x="55" y="201" width="210" height="28" fill="#34d399" opacity=".85"/>
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M290 160H420"/><path d="M290 187H420"/><path d="M290 215H420"/></g>
  <g font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <rect x="420" y="135" width="200" height="50" rx="8" fill="#38bdf8"/><text x="520" y="165">Worker A · x86</text>
    <rect x="420" y="192" width="200" height="50" rx="8" fill="#a78bfa"/><text x="520" y="222">Worker B · ARM</text>
    <rect x="420" y="249" width="200" height="38" rx="8" fill="#34d399"/><text x="520" y="274">Worker C</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M620 160H760"/><path d="M620 217H760"/><path d="M620 268H690V217"/></g>
  <rect x="760" y="150" width="150" height="100" rx="10" fill="#1e293b" stroke="url(#g)" stroke-width="2.5"/>
  <text x="835" y="195" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Gateway</text><text x="835" y="216" fill="#94a3b8" font-size="12" text-anchor="middle">soma e segue</text>
  <text x="935" y="190" fill="#94a3b8" font-size="13">Se um worker cai,</text><text x="935" y="210" fill="#94a3b8" font-size="13">suas faixas são</text><text x="935" y="230" fill="#94a3b8" font-size="13">reatribuídas.</text>
</svg>
