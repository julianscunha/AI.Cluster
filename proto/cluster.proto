syntax = "proto3";

package real_ai_cluster.v1;

message NodeId { string value = 1; }
message DeviceId { string value = 1; }

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  DISCOVERED = 1;
  VALIDATING = 2;
  READY = 3;
  ACTIVE = 4;
  DEGRADED = 5;
  DRAINING = 6;
  OFFLINE = 7;
  QUARANTINED = 8;
}

message Capability {
  double general_compute = 1;
  double memory_bandwidth = 2;
  double storage_score = 3;
  double network_score = 4;
  repeated string execution_backends = 5;
}

message Health {
  double overall = 1;
  double cpu = 2;
  double memory = 3;
  double storage = 4;
  double network = 5;
  double thermal = 6;
}

message NodeInfo {
  string node_id = 1;
  string device_id = 2;
  string hostname = 3;
  string architecture = 4;
  NodeState state = 5;
  Capability capability = 6;
  Health health = 7;
  string os_version = 8;
  string runtime_version = 9;
  int64 last_heartbeat_unix_ms = 10;
}

message RegisterNodeRequest {
  NodeInfo node = 1;
}

message RegisterNodeResponse {
  bool accepted = 1;
  string message = 2;
  NodeInfo node = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  int64 unix_ms = 2;
}

message HeartbeatResponse {
  bool accepted = 1;
  NodeState state = 2;
}

message ReportHealthRequest {
  string node_id = 1;
  Health health = 2;
}

message ReportHealthResponse {
  bool accepted = 1;
  NodeState state = 2;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

service ClusterControl {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportHealth(ReportHealthRequest) returns (ReportHealthResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
}
