syntax = "proto3";

package real_ai_cluster.v1;

message NodeId { string value = 1; }
message DeviceId { string value = 1; }

enum NodeState {
  NODE_STATE_UNSPECIFIED = 0;
  DISCOVERED = 1;
  VALIDATING = 2;
  READY = 3;
  ACTIVE = 4;
  DEGRADED = 5;
  DRAINING = 6;
  OFFLINE = 7;
  QUARANTINED = 8;
}

message StorageInfo {
  string name = 1;
  string kind = 2;
  uint64 size_bytes = 3;
  bool rotational = 4;
}

message Capability {
  repeated string execution_backends = 1;
  uint32 cpu_logical_cores = 2;
  uint64 memory_total_bytes = 3;
  repeated StorageInfo storage = 4;
  double cpu_ops_per_sec = 5;
  double memory_mb_per_sec = 6;
  double storage_write_mb_per_sec = 7;
  double network_rtt_us = 8;
  double network_mb_per_sec = 9;
}

message Health {
  double overall = 1;
  double cpu = 2;
  double memory = 3;
  double storage = 4;
  double network = 5;
  double thermal = 6;
}

message NodeInfo {
  string node_id = 1;
  string device_id = 2;
  string hostname = 3;
  string architecture = 4;
  NodeState state = 5;
  Capability capability = 6;
  Health health = 7;
  string os_version = 8;
  string runtime_version = 9;
  int64 last_heartbeat_unix_ms = 10;
  string worker_endpoint = 11;
  uint32 active_work_units = 12;
}

message RegisterNodeRequest { NodeInfo node = 1; }

message RegisterNodeResponse {
  bool accepted = 1;
  string message = 2;
  NodeInfo node = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  int64 unix_ms = 2;
}

message HeartbeatResponse {
  bool accepted = 1;
  NodeState state = 2;
}

message ReportHealthRequest {
  string node_id = 1;
  Health health = 2;
}

message ReportHealthResponse {
  bool accepted = 1;
  NodeState state = 2;
}

message ReportCapabilityRequest {
  string node_id = 1;
  Capability capability = 2;
}

message ReportCapabilityResponse {
  bool accepted = 1;
}

message NetworkPingRequest {
  string node_id = 1;
  bytes payload = 2;
}

message NetworkPingResponse {
  bool accepted = 1;
  string message = 2;
  bytes payload = 3;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

message WorkUnit {
  string work_id = 1;
  string operation = 2;
  bytes payload = 3;
  int32 priority = 4;
}

message SubmitWorkRequest { WorkUnit work = 1; }

message SubmitWorkResponse {
  bool accepted = 1;
  string message = 2;
  string assigned_node_id = 3;
  string operation = 4;
  uint64 duration_us = 5;
  bytes output = 6;
}

message ExecuteWorkRequest { WorkUnit work = 1; }

message ExecuteWorkResponse {
  bool accepted = 1;
  string message = 2;
  string node_id = 3;
  uint64 duration_us = 4;
  bytes output = 5;
}

message DistributedMatMulRequest {
  string work_id = 1;
  uint32 rows = 2;
  uint32 inner = 3;
  uint32 cols = 4;
  bytes matrix_a = 5;
  bytes matrix_b = 6;
  uint32 max_workers = 7;
}

message DistributedMatMulResponse {
  bool accepted = 1;
  string message = 2;
  uint32 workers_used = 3;
  uint64 duration_us = 4;
  bytes matrix_c = 5;
  uint64 compute_duration_us = 6;
  uint64 input_bytes_sent = 7;
}

message ExecuteMatrixBlockRequest {
  string work_id = 1;
  uint32 rows = 2;
  uint32 inner = 3;
  uint32 cols = 4;
  uint32 row_start = 5;
  uint32 row_count = 6;
  bytes matrix_a_shard = 7;
  bytes matrix_b = 8;
}

message ExecuteMatrixBlockResponse {
  bool accepted = 1;
  string message = 2;
  string node_id = 3;
  uint32 row_start = 4;
  uint32 row_count = 5;
  uint64 duration_us = 6;
  bytes matrix_c = 7;
}

message GraphWorkUnit {
  WorkUnit work = 1;
  repeated string depends_on = 2;
  repeated string required_backends = 3;
}

message SubmitGraphRequest {
  string execution_id = 1;
  repeated GraphWorkUnit units = 2;
}

message GraphWorkResult {
  string work_id = 1;
  bool accepted = 2;
  string message = 3;
  string node_id = 4;
  uint64 duration_us = 5;
  bytes output = 6;
}

message SubmitGraphResponse {
  bool accepted = 1;
  string message = 2;
  string execution_id = 3;
  repeated GraphWorkResult results = 4;
}

service ClusterControl {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ReportHealth(ReportHealthRequest) returns (ReportHealthResponse);
  rpc ReportCapability(ReportCapabilityRequest) returns (ReportCapabilityResponse);
  rpc NetworkPing(NetworkPingRequest) returns (NetworkPingResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc SubmitWork(SubmitWorkRequest) returns (SubmitWorkResponse);
  rpc SubmitGraph(SubmitGraphRequest) returns (SubmitGraphResponse);
  rpc DistributedMatMul(DistributedMatMulRequest) returns (DistributedMatMulResponse);
}

service WorkerRuntime {
  rpc ExecuteWork(ExecuteWorkRequest) returns (ExecuteWorkResponse);
  rpc ExecuteMatrixBlock(ExecuteMatrixBlockRequest) returns (ExecuteMatrixBlockResponse);
}
